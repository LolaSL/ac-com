<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Return air grille (standard HVAC symbol - hatched rectangle) -->
  <rect x="2" y="2" width="36" height="36" stroke="#CC4400" fill="none" stroke-width="2"/>
  <!-- Horizontal louver lines -->
  <line x1="4" y1="8" x2="36" y2="8" stroke="#CC4400" stroke-width="1.2"/>
  <line x1="4" y1="14" x2="36" y2="14" stroke="#CC4400" stroke-width="1.2"/>
  <line x1="4" y1="20" x2="36" y2="20" stroke="#CC4400" stroke-width="1.2"/>
  <line x1="4" y1="26" x2="36" y2="26" stroke="#CC4400" stroke-width="1.2"/>
  <line x1="4" y1="32" x2="36" y2="32" stroke="#CC4400" stroke-width="1.2"/>
  <!-- Inward arrow showing return air -->
  <polygon points="20,40 16,36 24,36" fill="#CC4400" opacity="0.7"/>
</svg>