<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- 4-way supply ceiling diffuser (standard HVAC symbol) -->
  <rect x="4" y="4" width="32" height="32" stroke="#0055CC" fill="none" stroke-width="2"/>
  <!-- 4 directional arrows -->
  <line x1="20" y1="4" x2="20" y2="12" stroke="#0055CC" stroke-width="1.5"/>
  <polygon points="17,12 20,7 23,12" fill="#0055CC"/>
  <line x1="20" y1="36" x2="20" y2="28" stroke="#0055CC" stroke-width="1.5"/>
  <polygon points="17,28 20,33 23,28" fill="#0055CC"/>
  <line x1="4" y1="20" x2="12" y2="20" stroke="#0055CC" stroke-width="1.5"/>
  <polygon points="12,17 7,20 12,23" fill="#0055CC"/>
  <line x1="36" y1="20" x2="28" y2="20" stroke="#0055CC" stroke-width="1.5"/>
  <polygon points="28,17 33,20 28,23" fill="#0055CC"/>
  <!-- Center X pattern -->
  <line x1="14" y1="14" x2="26" y2="26" stroke="#0055CC" stroke-width="1"/>
  <line x1="26" y1="14" x2="14" y2="26" stroke="#0055CC" stroke-width="1"/>
</svg>