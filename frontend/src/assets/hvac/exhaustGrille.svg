<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Exhaust air grille (standard HVAC symbol) -->
  <rect x="2" y="2" width="36" height="36" stroke="#228B22" fill="none" stroke-width="2"/>
  <!-- Diagonal hatching pattern -->
  <line x1="2" y1="10" x2="10" y2="2" stroke="#228B22" stroke-width="1"/>
  <line x1="2" y1="20" x2="20" y2="2" stroke="#228B22" stroke-width="1"/>
  <line x1="2" y1="30" x2="30" y2="2" stroke="#228B22" stroke-width="1"/>
  <line x1="2" y1="38" x2="38" y2="2" stroke="#228B22" stroke-width="1"/>
  <line x1="10" y1="38" x2="38" y2="10" stroke="#228B22" stroke-width="1"/>
  <line x1="20" y1="38" x2="38" y2="20" stroke="#228B22" stroke-width="1"/>
  <line x1="30" y1="38" x2="38" y2="30" stroke="#228B22" stroke-width="1"/>
  <!-- Outward arrow showing exhaust -->
  <polygon points="20,0 16,4 24,4" fill="#228B22" opacity="0.7"/>
</svg>