<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="#0055CC" stroke-width="2">
  <!-- Insulated Duct - duct with external insulation -->
  <!-- Outer insulation layer (dashed) -->
  <rect x="4" y="16" width="40" height="16" rx="3" fill="rgba(255,200,100,0.2)" stroke="#CC9900" stroke-dasharray="4,2"/>
  <!-- Inner duct -->
  <rect x="8" y="20" width="32" height="8" rx="1" fill="rgba(0,85,204,0.2)" stroke="#0055CC"/>
  <!-- Insulation pattern -->
  <line x1="6" y1="18" x2="10" y2="22" stroke="#CC9900" stroke-width="1"/>
  <line x1="14" y1="16" x2="18" y2="20" stroke="#CC9900" stroke-width="1"/>
  <line x1="22" y1="16" x2="26" y2="20" stroke="#CC9900" stroke-width="1"/>
  <line x1="30" y1="16" x2="34" y2="20" stroke="#CC9900" stroke-width="1"/>
  <line x1="38" y1="18" x2="42" y2="22" stroke="#CC9900" stroke-width="1"/>
</svg>
