<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Condensing unit / Outdoor unit (standard HVAC symbol) -->
  <rect x="3" y="3" width="44" height="44" rx="3" stroke="#333" fill="none" stroke-width="2.5"/>
  <!-- Fan circle -->
  <circle cx="25" cy="20" r="10" stroke="#333" fill="none" stroke-width="1.5"/>
  <!-- Fan blades -->
  <line x1="25" y1="10" x2="25" y2="16" stroke="#333" stroke-width="1.5"/>
  <line x1="25" y1="24" x2="25" y2="30" stroke="#333" stroke-width="1.5"/>
  <line x1="15" y1="20" x2="21" y2="20" stroke="#333" stroke-width="1.5"/>
  <line x1="29" y1="20" x2="35" y2="20" stroke="#333" stroke-width="1.5"/>
  <!-- Label -->
  <text x="25" y="42" font-size="9" font-family="Arial" font-weight="bold" fill="#333" text-anchor="middle">COND</text>
</svg>