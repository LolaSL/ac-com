<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Round ceiling supply diffuser (standard HVAC symbol) -->
  <circle cx="20" cy="20" r="16" stroke="#0055CC" fill="none" stroke-width="2"/>
  <circle cx="20" cy="20" r="8" stroke="#0055CC" fill="none" stroke-width="1.5"/>
  <circle cx="20" cy="20" r="2" fill="#0055CC"/>
  <!-- 4 radial arrows (outward airflow) -->
  <line x1="20" y1="8" x2="20" y2="4" stroke="#0055CC" stroke-width="1.5"/>
  <polygon points="18,6 20,2 22,6" fill="#0055CC"/>
  <line x1="20" y1="32" x2="20" y2="36" stroke="#0055CC" stroke-width="1.5"/>
  <polygon points="18,34 20,38 22,34" fill="#0055CC"/>
  <line x1="8" y1="20" x2="4" y2="20" stroke="#0055CC" stroke-width="1.5"/>
  <polygon points="6,18 2,20 6,22" fill="#0055CC"/>
  <line x1="32" y1="20" x2="36" y2="20" stroke="#0055CC" stroke-width="1.5"/>
  <polygon points="34,18 38,20 34,22" fill="#0055CC"/>
</svg>